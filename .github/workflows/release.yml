name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- x64 ---
          - os: windows-latest
            target: windows-x64
            exe: asciidoctor-d.exe
            archive: zip
          - os: ubuntu-latest
            target: linux-x64
            exe: asciidoctor-d
            archive: tar.gz
          # --- Apple Silicon (default Mac in 2026) ---
          - os: macos-latest
            target: macos-arm64
            exe: asciidoctor-d
            archive: tar.gz
          # --- Intel Mac (legacy; last sold ~2023) ---
          - os: macos-15-intel
            target: macos-x64
            exe: asciidoctor-d
            archive: tar.gz
          # --- Linux ARM64 (native runner) ---
          - os: ubuntu-24.04-arm
            target: linux-arm64
            exe: asciidoctor-d
            archive: tar.gz
          # --- Windows ARM64 (cross-compile from x64 host; LDC multilib) ---
          - os: windows-latest
            target: windows-arm64
            exe: asciidoctor-d.exe
            archive: zip
            cross_arch: aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: MSVC arm64 cross env (Windows ARM64)
        if: runner.os == 'Windows' && matrix.cross_arch == 'aarch64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Install LDC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ldc -y
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $ldcDir = Split-Path (Get-Command ldc2).Source
          $dubDir = Split-Path (Get-Command dub).Source
          Add-Content -Path $env:GITHUB_PATH -Value $ldcDir
          if ($dubDir -ne $ldcDir) { Add-Content -Path $env:GITHUB_PATH -Value $dubDir }
          ldc2 --version
          dub --version

      - name: Install LDC (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if sudo apt-get update && sudo apt-get install -y ldc dub; then
            ldc2 --version
            dub --version
          else
            echo "apt LDC unavailable; installing official aarch64/x86_64 tarball"
            ARCH=$(uname -m)
            case "$ARCH" in
              aarch64|arm64) ASSET_ARCH=aarch64 ;;
              x86_64|amd64) ASSET_ARCH=x86_64 ;;
              *) echo "Unsupported Linux arch: $ARCH"; exit 1 ;;
            esac
            VER=$(curl -fsSL https://api.github.com/repos/ldc-developers/ldc/releases/latest | jq -r .tag_name | sed 's/^v//')
            URL="https://github.com/ldc-developers/ldc/releases/download/v${VER}/ldc2-${VER}-linux-${ASSET_ARCH}.tar.xz"
            curl -fsSL "$URL" -o /tmp/ldc.tar.xz
            sudo tar -xJf /tmp/ldc.tar.xz -C /opt
            LDC_HOME=$(echo /opt/ldc2-*-linux-*)
            echo "$LDC_HOME/bin" >> "$GITHUB_PATH"
            export PATH="$LDC_HOME/bin:$PATH"
            ldc2 --version
            dub --version
          fi

      - name: Install LDC (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ldc dub
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix)/bin:$PATH"
          ldc2 --version
          dub --version

      - name: Build CLI
        shell: bash
        env:
          CROSS_ARCH: ${{ matrix.cross_arch }}
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            export PATH="$(brew --prefix)/bin:$PATH"
          fi
          command -v dub
          command -v ldc2

          EXTRA_ARGS=()
          if [[ "${CROSS_ARCH:-}" == "aarch64" ]]; then
            # Windows ARM64 via LDC multilib + MSVC arm64 env (ilammy/msvc-dev-cmd)
            EXTRA_ARGS+=(--arch=aarch64)
            export DFLAGS="${DFLAGS:-} -mtriple=aarch64-windows-msvc"
            echo "Cross-compiling for aarch64-windows-msvc"
          fi

          dub build --config=application --build=release --compiler=ldc2 "${EXTRA_ARGS[@]}"
          mkdir -p dist
          if [ -f asciidoctor-d.exe ]; then
            cp asciidoctor-d.exe "dist/${{ matrix.exe }}"
          elif [ -f asciidoctor-d ]; then
            cp asciidoctor-d "dist/${{ matrix.exe }}"
          else
            echo "Built binary not found" >&2
            ls -la
            exit 1
          fi
          chmod +x "dist/${{ matrix.exe }}" || true
          # Smoke only when not cross-compiling (can't run arm64 exe on x64 without emulation)
          if [[ -z "${CROSS_ARCH:-}" ]]; then
            "dist/${{ matrix.exe }}" --help >/dev/null 2>&1 || "dist/${{ matrix.exe }}" -h >/dev/null 2>&1 || true
          else
            file "dist/${{ matrix.exe }}" || true
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../asciidoctor-d-${{ matrix.target }}.zip" "${{ matrix.exe }}"
          else
            tar -czf "../asciidoctor-d-${{ matrix.target }}.tar.gz" "${{ matrix.exe }}"
          fi
          ls -la ..

      - uses: actions/upload-artifact@v4
        with:
          name: asciidoctor-d-${{ matrix.target }}
          path: asciidoctor-d-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Native AsciiDoc engine (`asciidoctor-d`) CLI builds.

            ## Assets
            | Archive | Platform |
            |---|---|
            | `windows-x64` | Windows x86_64 |
            | `windows-arm64` | Windows ARM64 (Snapdragon / WoA) |
            | `linux-x64` | Linux x86_64 |
            | `linux-arm64` | Linux aarch64 |
            | `macos-arm64` | Apple Silicon (default Mac) |
            | `macos-x64` | Intel Mac (legacy) |

            RISC-V is not shipped yet (no stable GitHub-hosted runner / not immediate demand).

            ## Install
            Download the archive for your OS/arch, put `asciidoctor-d` on your PATH.

            The Zed extension downloads the matching asset when
            `engine` is set to `asciidoctor-d`.
